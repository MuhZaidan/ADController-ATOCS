[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	iakop/LiquidCrystal_I2C_ESP32@^1.1.6
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6
	dantudose/AT24C256 library@^1.0
	argandas/serialEEPROM@^2.0.1
	sparkfun/SparkFun External EEPROM Arduino Library@^3.2.13
